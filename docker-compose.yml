services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data        # SQLite живёт здесь и переживает пересборку
    restart: unless-stopped     # упал процесс или перезагрузился сервер — поднимется сам
    ports:
      - "127.0.0.1:8080:8080"   # /health; для внешнего мониторинга убрать 127.0.0.1:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Фейковый Nightscout для демо и обкатки. Запускается только с профилем demo:
  #   docker compose --profile demo up -d
  # В боте адрес: http://fake-ns:1337, токен: значение FAKE_NS_TOKEN.
  fake-ns:
    image: python:3.11-slim
    profiles: ["demo"]
    environment:
      PYTHONUNBUFFERED: "1"     # иначе вывод fake-NS теряется и docker compose logs пустой
    volumes:
      - ./fake_cgm:/fake:ro
    command: >
      python /fake/fake_cgm.py --serve
      --scenario ${SCENARIO:-night_hypo} --speed ${SPEED:-30}
      --skip ${SKIP:-150} --token ${FAKE_NS_TOKEN:-secret}
    ports:
      - "127.0.0.1:1337:1337"   # только с этой машины: для scripts/check_ns.py
    restart: unless-stopped
